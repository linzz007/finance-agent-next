<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F3F0EE">
  <title>Finance Agent | 投研工作台</title>
  <link rel="stylesheet" href="/static/h2-workbench/style.css?v=110">
  <script defer src="/static/h2-workbench/lucide.min.js"></script>
  <script defer src="/static/h2-workbench/marked.min.js"></script>
  <script defer src="/static/h2-workbench/purify.min.js"></script>
  <script defer src="/static/h2-workbench/app.js?v=110"></script>
</head>
<body>
  <a class="skip-link" href="#messages">跳至研究内容</a>
  <button id="drawer-scrim" class="drawer-scrim" aria-label="关闭侧边面板" hidden></button>
  <aside id="sidebar" class="sidebar" aria-label="研究导航">
    <div class="brand-row">
      <a class="brand" href="/workbench" aria-label="Finance Agent 投研工作台"><span class="brand-mark"><i data-lucide="chart-no-axes-combined"></i></span><span><b>Finance Agent<span class="brand-dot">.</span></b><small>投研工作台</small></span></a>
      <button id="close-nav" class="icon-button mobile-only" title="关闭导航" aria-label="关闭导航"><i data-lucide="x"></i></button>
    </div>
    <button id="new-session" class="primary new-research"><i data-lucide="plus"></i>新的研究<i data-lucide="arrow-up-right" class="trailing-icon"></i></button>
    <div class="record-heading">我的工作空间 <span class="small-label">H2</span></div>
    <div class="record-tabs" role="tablist" aria-label="记录类型">
      <button id="tab-sessions" role="tab" aria-selected="true" aria-controls="sessions"><i data-lucide="notebook-pen"></i>研究记录</button>
      <button id="tab-archives" role="tab" aria-selected="false" aria-controls="archives"><i data-lucide="archive"></i>测试记录</button>
    </div>
    <label class="record-search"><i data-lucide="search"></i><input id="record-search" type="search" placeholder="搜索记录" aria-label="搜索记录" autocomplete="off"></label>
    <div class="record-list-label"><span id="record-list-title">最近研究</span><span id="record-count">0</span></div>
    <nav id="sessions" class="record-list" aria-label="研究记录"></nav>
    <nav id="archives" class="record-list" aria-label="测试记录" hidden></nav>
    <div id="record-empty" class="empty-records" hidden>没有匹配的记录</div>
    <div class="sidebar-footer"><span class="workspace-avatar"><i data-lucide="landmark"></i></span><div><b>个人研究空间</b><span id="backend">正在连接</span></div><span class="status-dot" id="connection-dot"></span></div>
  </aside>
  <main id="main">
    <header class="topbar">
      <button id="open-nav" class="icon-button mobile-only" aria-label="打开研究导航" title="研究导航" aria-controls="sidebar" aria-expanded="false"><i data-lucide="panel-left"></i></button>
      <div class="breadcrumb"><span>工作空间</span><i data-lucide="chevron-right"></i><h1 id="session-title">新的研究</h1></div>
      <div class="topbar-actions"><label id="model-select" class="model-select"><i data-lucide="sparkles"></i><select id="model" aria-label="本轮模型"></select></label><button id="toggle-inspector" class="icon-button" title="执行详情" aria-label="执行详情" aria-controls="inspector" aria-expanded="true"><i data-lucide="panel-right"></i></button></div>
    </header>
    <div id="error" class="error-banner" role="alert" hidden><span id="error-text"></span><button id="retry-load" class="quiet" type="button"><i data-lucide="rotate-cw"></i>重试读取</button></div>
    <div id="archive-banner" class="archive-banner" hidden><span><i data-lucide="archive"></i><span id="archive-description"></span></span><span class="readonly-label"><i data-lucide="lock-keyhole"></i>历史测试 · 只读</span></div>
    <section id="messages" class="messages" aria-label="研究报告" aria-live="polite" tabindex="-1"></section>
    <form id="composer">
      <label for="query" class="composer-label">研究问题</label>
      <textarea id="query" rows="2" maxlength="4096" placeholder="你想研究什么？" aria-label="研究问题" required></textarea>
      <div class="composer-actions"><span id="run-status" role="status">就绪</span><div><button id="cancel" type="button" class="quiet" hidden><i data-lucide="square"></i>停止研究</button><button id="send" class="primary" type="submit"><span>开始研究</span><i data-lucide="arrow-up"></i></button></div></div>
    </form>
    <footer class="workspace-footer"><span>FINANCE AGENT</span><span>独立思考，有据可循。</span><span>Research workspace / 2.0</span></footer>
  </main>
  <aside id="inspector" class="inspector" aria-label="执行详情">
    <header class="inspector-header"><div><span class="eyebrow">RESEARCH ACTIVITY</span><h2>执行详情</h2></div><div class="header-tools"><button id="refresh" class="icon-button" title="刷新执行记录" aria-label="刷新执行记录"><i data-lucide="refresh-cw"></i></button><button id="close-inspector" class="icon-button" title="收起执行详情" aria-label="收起执行详情"><i data-lucide="panel-right-close"></i></button></div></header>
    <div id="execution-summary" class="execution-summary"><span class="badge idle">尚未开始</span><span id="updated-at">等待研究任务</span></div>
    <div id="stats" class="stats"><div><b>0</b><span>模型请求</span></div><div><b>0</b><span>Agent 任务</span></div><div><b>0</b><span>执行步数</span></div></div>
    <div id="activity-chart" class="activity-chart" hidden></div>
    <details class="run-meta"><summary>运行信息与预算</summary><div class="run-info-label">Run ID</div><code id="run-id">尚未创建</code><div id="run-model"></div><div id="budget" class="budget"></div></details>
    <div class="tabs inspector-tabs" role="tablist" aria-label="执行视图"><button id="tab-tasks" role="tab" aria-selected="true" aria-controls="tasks">任务树</button><button id="tab-sources" role="tab" aria-selected="false" aria-controls="sources">数据来源 <span id="source-count">0</span></button><button id="tab-events" role="tab" aria-selected="false" aria-controls="events">Trace <span id="event-count">0</span></button></div>
    <section id="tasks" class="inspection-content" aria-label="任务树"></section>
    <section id="sources" class="inspection-content" aria-label="数据来源" hidden></section>
    <section id="events" class="inspection-content" aria-label="Trace 事件" hidden><div id="trace-calls"></div></section>
    <footer class="inspector-footer"><i data-lucide="shield-check"></i><span>执行状态不等同于研究结论已获证实</span></footer>
  </aside>
  <dialog id="artifact-dialog" aria-labelledby="artifact-heading"><header><div><span class="eyebrow">SOURCE &amp; RECORD</span><h2 id="artifact-heading">资料与执行记录</h2></div><button id="close-dialog" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></header><div class="artifact-meta"><code id="artifact-title"></code><span id="artifact-progress" role="status"></span></div><div class="tabs" role="tablist" aria-label="资料显示方式"><button id="artifact-preview-tab" role="tab" aria-selected="true">阅读视图</button><button id="artifact-raw-tab" role="tab" aria-selected="false">原始数据</button></div><div id="artifact-scroll"><div id="artifact-preview" class="body"></div><pre id="artifact-body" hidden></pre></div><div id="artifact-error" role="alert" hidden></div><footer class="artifact-footer"><span id="artifact-completeness"></span><button id="more-artifact" class="secondary" hidden><i data-lucide="chevron-down"></i>继续读取</button><button id="retry-artifact" class="secondary" hidden><i data-lucide="rotate-cw"></i>重试读取</button></footer></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
