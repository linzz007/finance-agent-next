[project]
name = "finance-agent-next"
version = "0.1.0"
description = "Independent financial research Agent with a self-developed runtime, evidence, skills, and trace."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.1",
  "uvicorn[standard]>=0.27.0",
  "streamlit>=1.31.0",
  "pydantic>=2.6.0",
  "exchange-calendars==4.13.2",
  "websockets>=15,<17",
  "ddgs>=9.16,<10",
  "trafilatura>=2.2,<3",
  "lxml_html_clean>=0.4",
  "redis>=5,<7",
  "httpx>=0.27,<1",
  "fakeredis>=2.31,<3",
]

[project.optional-dependencies]
dispatch = ["redis>=5,<7", "httpx>=0.27,<1"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.11,<1",
  "fakeredis>=2.31,<3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
